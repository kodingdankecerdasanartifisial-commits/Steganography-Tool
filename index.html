<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYETAK - Steganography Tool</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'JetBrains Mono', monospace; background-color: #000000; color: #d4d4d4; }
        .bento-card { background-color: #171717; border: 1px solid #262626; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { Zap, Unlock, Cpu, Upload, Image: ImageIcon, ChevronRight } = window.lucide;
        const STEG_MARKER = "EOFSTEG1";

        const App = () => {
            const [activeTab, setActiveTab] = React.useState('embed');
            const [isProcessing, setIsProcessing] = React.useState(false);
            const [error, setError] = React.useState(null);
            const [embedCover, setEmbedCover] = React.useState(null);
            const [secretText, setSecretText] = React.useState('');
            const [embedResult, setEmbedResult] = React.useState(null);
            const [extractSource, setExtractSource] = React.useState(null);
            const [extractResult, setExtractResult] = React.useState(null);

            const coverRef = React.useRef();
            const extractRef = React.useRef();

            const handleEmbed = async () => {
                setError(null);
                try {
                    if (!embedCover) throw new Error("Missing cover image.");
                    if (!secretText.trim()) throw new Error("Secret message is empty.");
                    
                    setIsProcessing(true);
                    const coverBuf = new Uint8Array(await embedCover.arrayBuffer());
                    const secretBuf = new TextEncoder().encode(secretText);
                    const metadata = { 
                        imageSize: coverBuf.length, 
                        secretFilename: "secret_message.txt", 
                        mimeType: "text/plain", 
                        timestamp: new Date().toISOString() 
                    };
                    const metaBuf = new TextEncoder().encode(JSON.stringify(metadata));
                    const markerBuf = new TextEncoder().encode(STEG_MARKER);

                    const final = new Uint8Array(coverBuf.length + secretBuf.length + metaBuf.length + markerBuf.length);
                    final.set(coverBuf, 0);
                    final.set(secretBuf, coverBuf.length);
                    final.set(metaBuf, coverBuf.length + secretBuf.length);
                    final.set(markerBuf, coverBuf.length + secretBuf.length + metaBuf.length);

                    setEmbedResult({
                        url: URL.createObjectURL(new Blob([final], { type: embedCover.type })),
                        name: "NYETAK_" + embedCover.name
                    });
                } catch (e) { 
                    setError(e.message); 
                } finally { 
                    setIsProcessing(false); 
                }
            };

            const handleExtract = async () => {
                setError(null);
                try {
                    if (!extractSource) throw new Error("No source file selected.");
                    setIsProcessing(true);
                    const buf = new Uint8Array(await extractSource.arrayBuffer());
                    const decoder = new TextDecoder();

                    if (decoder.decode(buf.slice(-STEG_MARKER.length)) !== STEG_MARKER) {
                        throw new Error("Invalid marker. EOFSTEG1 missing.");
                    }

                    let meta = null;
                    const scanLimit = Math.min(buf.length, 5120);
                    for (let i = buf.length - STEG_MARKER.length - 1; i > buf.length - scanLimit; i--) {
                        if (buf[i] === 123) {
                            try {
                                const p = JSON.parse(decoder.decode(buf.slice(i, buf.length - STEG_MARKER.length)));
                                if (p.imageSize) { meta = p; break; }
                            } catch (e) {}
                        }
                    }

                    if (!meta) throw new Error("Metadata segment not found.");
                    const secretData = buf.slice(meta.imageSize, buf.length - STEG_MARKER.length - JSON.stringify(meta).length);

                    setExtractResult({
                        secret: URL.createObjectURL(new Blob([secretData], { type: meta.mimeType })),
                        filename: meta.secretFilename,
                        preview: decoder.decode(secretData).slice(0, 2000)
                    });
                } catch (e) { 
                    setError(e.message); 
                } finally { 
                    setIsProcessing(false); 
                }
            };

            return (
                <div className="min-h-screen p-6 md:p-12">
                    <div className="max-w-5xl mx-auto space-y-6">
                        <header className="p-6 bento-card border-l-4 border-[#84cc16] flex justify-between items-center">
                            <div>
                                <h1 className="text-3xl font-bold tracking-tighter text-[#84cc16]">NYETAK</h1>
                                <p className="text-[10px] text-neutral-500 tracking-[0.3em] uppercase">Secure Data Embedding Protocol</p>
                            </div>
                            <Cpu className="w-10 h-10 text-neutral-800" />
                        </header>

                        <div className="grid md:grid-cols-4 gap-6">
                            <nav className="flex flex-col gap-2">
                                <button onClick={() => setActiveTab('embed')} className={"p-4 text-left border " + (activeTab === 'embed' ? "border-[#84cc16] bg-[#84cc16]/5" : "border-neutral-800")}>
                                    <Zap className="w-4 h-4 inline mr-2 text-[#84cc16]"/> EMBED
                                </button>
                                <button onClick={() => setActiveTab('extract')} className={"p-4 text-left border " + (activeTab === 'extract' ? "border-[#84cc16] bg-[#84cc16]/5" : "border-neutral-800")}>
                                    <Unlock className="w-4 h-4 inline mr-2 text-[#84cc16]"/> EXTRACT
                                </button>
                            </nav>

                            <main className="md:col-span-3 bento-card p-8 min-h-[400px]">
                                {error && <div className="mb-4 text-red-500 text-xs font-bold uppercase">&gt; ERROR: {error}</div>}
                                
                                {activeTab === 'embed' ? (
                                    <div className="space-y-6">
                                        <div onClick={() => coverRef.current.click()} className="border-2 border-dashed border-neutral-800 h-32 flex flex-col items-center justify-center cursor-pointer">
                                            <input type="file" className="hidden" ref={coverRef} onChange={e => setEmbedCover(e.target.files[0])} />
                                            {embedCover ? <span className="text-[#84cc16] text-xs">{embedCover.name}</span> : <Upload className="text-neutral-700" />}
                                        </div>
                                        <textarea value={secretText} onChange={e => setSecretText(e.target.value)} placeholder="Tulis pesan rahasia..." className="w-full h-24 bg-black border border-neutral-800 p-3 text-xs outline-none" />
                                        <button onClick={handleEmbed} className="w-full py-4 bg-[#84cc16] text-black font-bold text-xs uppercase">Run Protocol</button>
                                        {embedResult && <a href={embedResult.url} download={embedResult.name} className="block text-center p-3 bg-white text-black font-bold text-xs">DOWNLOAD RESULT</a>}
                                    </div>
                                ) : (
                                    <div className="space-y-6">
                                        <div onClick={() => extractRef.current.click()} className="border-2 border-dashed border-neutral-800 h-32 flex flex-col items-center justify-center cursor-pointer">
                                            <input type="file" className="hidden" ref={extractRef} onChange={e => setExtractSource(e.target.files[0])} />
                                            {extractSource ? <span className="text-[#84cc16] text-xs">{extractSource.name}</span> : <Upload className="text-neutral-700" />}
                                        </div>
                                        <button onClick={handleExtract} className="w-full py-4 bg-white text-black font-bold text-xs uppercase">Decrypt & Extract</button>
                                        {extractResult && (
                                            <div className="p-4 bg-black border border-neutral-800">
                                                <p className="text-[#84cc16] text-[10px] font-bold mb-2">CONTENT DETECTED:</p>
                                                <p className="text-xs text-neutral-400 mb-4">{extractResult.preview}</p>
                                                <a href={extractResult.secret} download={extractResult.filename} className="text-[10px] underline uppercase">Download Secret File</a>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </main>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
