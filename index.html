<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYETAK - Steganography Tool</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { 
            font-family: 'JetBrains Mono', monospace; 
            background-color: #000000;
            color: #d4d4d4;
            margin: 0;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { Zap, Unlock, Cpu, Upload } = lucide;

        const App = () => {
            const [tab, setTab] = React.useState('embed');

            return (
                <div className="min-h-screen p-4 md:p-10">
                    <div className="max-w-4xl mx-auto">
                        {/* Header sesuai PRD */}
                        <header className="mb-8 p-6 bg-neutral-900 border-l-4 border-[#84cc16] flex justify-between items-center">
                            <div>
                                <h1 className="text-3xl font-bold text-[#84cc16] tracking-tighter">NYETAK</h1>
                                <p className="text-[10px] text-neutral-500 uppercase tracking-widest">Client-Side Steganography</p>
                            </div>
                            <Cpu className="text-neutral-800 w-8 h-8" />
                        </header>

                        <div className="grid md:grid-cols-4 gap-6">
                            {/* Navigasi */}
                            <div className="md:col-span-1 flex flex-col gap-2">
                                <button onClick={() => setTab('embed')} className={`p-4 border text-xs font-bold ${tab === 'embed' ? 'border-[#84cc16] bg-[#84cc16]/10 text-white' : 'border-neutral-800'}`}>EMBED</button>
                                <button onClick={() => setTab('extract')} className={`p-4 border text-xs font-bold ${tab === 'extract' ? 'border-[#84cc16] bg-[#84cc16]/10 text-white' : 'border-neutral-800'}`}>EXTRACT</button>
                            </div>

                            {/* Main Area */}
                            <div className="md:col-span-3 bg-neutral-900/40 border border-neutral-800 p-8 min-h-[300px]">
                                <h2 className="text-[#84cc16] text-xs font-bold mb-4 uppercase tracking-widest italic font-bold">
                                    > SYSTEM_READY: {tab.toUpperCase()} MODE
                                </h2>
                                
                                <div className="border-2 border-dashed border-neutral-800 h-40 flex flex-col items-center justify-center text-neutral-600 hover:border-[#84cc16] cursor-pointer transition-all">
                                    <Upload className="mb-2" />
                                    <span className="text-[10px]">DROP FILE OR CLICK TO UPLOAD</span>
                                </div>

                                <button className="w-full mt-6 py-4 bg-[#84cc16] text-black font-bold text-xs uppercase hover:bg-[#a3e635] transition-colors">
                                    Run Protocol
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Render ke div root
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
