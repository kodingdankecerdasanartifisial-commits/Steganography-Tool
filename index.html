<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYETAK - Steganography Tool</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'JetBrains Mono', monospace; background-color: #000000; color: #a3e635; }
        .bento-card { background-color: rgba(23, 23, 23, 0.9); border: 1px solid #262626; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Marker sesuai spesifikasi teknis 
        const MARKER = "EOFSTEG1";

        function App() {
            const [tab, setTab] = React.useState('embed'); [cite: 35, 38]
            const [cover, setCover] = React.useState(null); [cite: 50]
            const [text, setText] = React.useState(''); [cite: 58]
            const [result, setResult] = React.useState(null); [cite: 74]
            const [extractFile, setExtractFile] = React.useState(null); [cite: 81]
            const [output, setOutput] = React.useState(null); [cite: 92]

            const onEmbed = async () => {
                if (!cover || !text) return alert("Data tidak lengkap!"); [cite: 105, 107]
                const cBuf = new Uint8Array(await cover.arrayBuffer()); [cite: 63]
                const sBuf = new TextEncoder().encode(text); [cite: 65]
                const meta = JSON.stringify({ imageSize: cBuf.length, name: "secret.txt" }); [cite: 66, 67]
                const mBuf = new TextEncoder().encode(meta);
                const mark = new TextEncoder().encode(MARKER);

                const final = new Uint8Array(cBuf.length + sBuf.length + mBuf.length + mark.length); [cite: 73]
                final.set(cBuf, 0);
                final.set(sBuf, cBuf.length);
                final.set(mBuf, cBuf.length + sBuf.length);
                final.set(mark, cBuf.length + sBuf.length + mBuf.length);

                setResult(URL.createObjectURL(new Blob([final], { type: cover.type }))); [cite: 77]
            };

            const onExtract = async () => {
                if (!extractFile) return; [cite: 108]
                const buf = new Uint8Array(await extractFile.arrayBuffer()); [cite: 87]
                const dec = new TextDecoder();
                if (dec.decode(buf.slice(-MARKER.length)) !== MARKER) return alert("Bukan file NYETAK!"); [cite: 109]
                
                // Scan metadata sederhana [cite: 89]
                const metaStr = dec.decode(buf.slice(-200)).split('}')[0] + '}';
                try {
                    const meta = JSON.parse(metaStr.substring(metaStr.lastIndexOf('{'))); [cite: 90]
                    const secret = buf.slice(meta.imageSize, buf.indexOf(metaStr)); [cite: 91]
                    setOutput(dec.decode(secret)); [cite: 96]
                } catch(e) { alert("Gagal ekstrak metadata."); } [cite: 111]
            };

            return (
                <div className="p-6 md:p-12 max-w-5xl mx-auto space-y-6">
                    <header className="p-8 bento-card border-l-4 border-[#84cc16]">
                        <h1 className="text-3xl font-bold text-[#84cc16]">NYETAK // STG</h1> [cite: 2, 29]
                        <p className="text-[10px] text-neutral-500 uppercase tracking-widest">Secure Data Protocol v1.0</p> [cite: 3, 30]
                    </header>

                    <div className="grid md:grid-cols-4 gap-6">
                        <nav className="flex flex-col gap-2">
                            <button onClick={() => setTab('embed')} className={`p-4 border text-xs font-bold ${tab === 'embed' ? 'border-[#84cc16] bg-[#84cc16]/10' : 'border-neutral-800'}`}>EMBED</button> [cite: 35]
                            <button onClick={() => setTab('extract')} className={`p-4 border text-xs font-bold ${tab === 'extract' ? 'border-[#84cc16] bg-[#84cc16]/10' : 'border-neutral-800'}`}>EXTRACT</button> [cite: 38]
                        </nav>

                        <main className="md:col-span-3 bento-card p-8 min-h-[400px]">
                            {tab === 'embed' ? (
                                <div className="space-y-6">
                                    <div className="border-2 border-dashed border-neutral-800 p-8 text-center">
                                        <input type="file" onChange={e => setCover(e.target.files[0])} className="text-xs" /> [cite: 52]
                                    </div>
                                    <textarea value={text} onChange={e => setText(e.target.value)} placeholder="Pesan rahasia..." className="w-full h-32 bg-black border border-neutral-800 p-4 text-xs text-[#84cc16] outline-none" /> [cite: 58]
                                    <button onClick={onEmbed} className="w-full py-4 bg-[#84cc16] text-black font-bold uppercase text-xs">Execute Embed</button> [cite: 60]
                                    {result && <a href={result} download="stego.png" className="block text-center p-3 bg-white text-black font-bold text-xs">DOWNLOAD RESULT</a>} [cite: 77]
                                </div>
                            ) : (
                                <div className="space-y-6">
                                    <div className="border-2 border-dashed border-neutral-800 p-8 text-center">
                                        <input type="file" onChange={e => setExtractFile(e.target.files[0])} className="text-xs" /> [cite: 81]
                                    </div>
                                    <button onClick={onExtract} className="w-full py-4 bg-white text-black font-bold uppercase text-xs">Decrypt & Extract</button> [cite: 85]
                                    {output && <div className="p-4 bg-black border border-neutral-800 text-xs text-neutral-400 font-mono">{output}</div>} [cite: 96]
                                </div>
                            )}
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
