<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKA Masduki - Steganography Tool</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'JetBrains Mono', monospace; 
            background-color: #000000; 
            color: #d4d4d4;
        }
        .bento-card { 
            background-color: #0a0a0a; 
            border: 1px solid #1a1a1a; 
        }
        .lime-glow {
            text-shadow: 0 0 10px rgba(132, 204, 22, 0.5);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #84cc16; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { 
            Zap, Unlock, Cpu, Upload, Image: ImageIcon, 
            FileText, ChevronRight, Terminal 
        } = window.lucide;

        const STEG_MARKER = "EOFSTEG1";

        const App = () => {
            const [activeTab, setActiveTab] = React.useState('embed');
            const [embedCover, setEmbedCover] = React.useState(null);
            const [secretText, setSecretText] = React.useState('');
            const [embedResult, setEmbedResult] = React.useState(null);
            const [extractSource, setExtractSource] = React.useState(null);
            const [extractResult, setExtractResult] = React.useState(null);

            const handleEmbed = async () => {
                const coverBuf = new Uint8Array(await embedCover.arrayBuffer());
                const secretBuf = new TextEncoder().encode(secretText);
                const metadata = { imageSize: coverBuf.length, secretFilename: "secret.txt", mimeType: "text/plain" };
                const metaBuf = new TextEncoder().encode(JSON.stringify(metadata));
                const markerBuf = new TextEncoder().encode(STEG_MARKER);

                const final = new Uint8Array(coverBuf.length + secretBuf.length + metaBuf.length + markerBuf.length);
                final.set(coverBuf, 0);
                final.set(secretBuf, coverBuf.length);
                final.set(metaBuf, coverBuf.length + secretBuf.length);
                final.set(markerBuf, coverBuf.length + secretBuf.length + metaBuf.length);

                setEmbedResult({
                    url: URL.createObjectURL(new Blob([final], { type: embedCover.type })),
                    name: "NYETAK_" + embedCover.name
                });
            };

            const handleExtract = async () => {
                const buf = new Uint8Array(await extractSource.arrayBuffer());
                const decoder = new TextDecoder();
                const secretData = buf.slice(0, -STEG_MARKER.length); // Sederhanakan untuk demo
                setExtractResult({ preview: decoder.decode(secretData).slice(-100) });
            };

            return (
                <div className="min-h-screen p-4 md:p-10">
                    <div className="max-w-6xl mx-auto space-y-6">
                        {/* Header Banner - Sesuai Gambar  */}
                        <header className="p-6 bento-card border-l-4 border-[#84cc16] flex justify-between items-center">
                            <div>
                                <h1 className="text-3xl font-bold tracking-tighter text-[#84cc16] lime-glow">NYETAK // <span className="text-neutral-500">steganography</span></h1>
                                <p className="text-[10px] text-neutral-500 tracking-[0.3em] uppercase mt-1">Secure Data Embedding Protocol V1.0</p>
                            </div>
                            <Cpu className="w-10 h-10 text-neutral-800" />
                        </header>

                        <div className="grid md:grid-cols-12 gap-6">
                            {/* Sidebar Navigasi - Sesuai Gambar  */}
                            <aside className="md:col-span-3 space-y-4">
                                <nav className="space-y-2">
                                    <button onClick={() => setActiveTab('embed')} className={`w-full p-4 flex items-center gap-3 border ${activeTab === 'embed' ? 'border-[#84cc16] bg-[#84cc16]/10 text-white' : 'border-neutral-900 text-neutral-600'}`}>
                                        <Zap className={`w-4 h-4 ${activeTab === 'embed' ? 'text-[#84cc16]' : ''}`} />
                                        <div className="text-left">
                                            <p className="text-xs font-bold uppercase">Embed</p>
                                            <p className="text-[9px] opacity-50">Sembunyikan Data</p>
                                        </div>
                                    </button>
                                    <button onClick={() => setActiveTab('extract')} className={`w-full p-4 flex items-center gap-3 border ${activeTab === 'extract' ? 'border-[#84cc16] bg-[#84cc16]/10 text-white' : 'border-neutral-900 text-neutral-600'}`}>
                                        <Unlock className={`w-4 h-4 ${activeTab === 'extract' ? 'text-[#84cc16]' : ''}`} />
                                        <div className="text-left">
                                            <p className="text-xs font-bold uppercase">Extract</p>
                                            <p className="text-[9px] opacity-50">Buka Data</p>
                                        </div>
                                    </button>
                                </nav>

                                <div className="p-4 bento-card text-[9px] space-y-2 font-mono">
                                    <div className="flex justify-between items-center mb-2">
                                        <span className="text-neutral-500 uppercase">System Monitor</span>
                                        <span className="w-2 h-2 rounded-full bg-green-500 shadow-[0_0_5px_green]"></span>
                                    </div>
                                    <p className="text-green-500">&gt; SYSTEM: ONLINE</p>
                                    <p className="text-neutral-600">&gt; ENCRYPTION: NONE</p>
                                    <p className="text-neutral-600">&gt; METHOD: EOF APPEND</p>
                                    <p className="text-white">&gt; {embedCover ? 'COVER LOADED' : 'WAITING INPUT'}</p>
                                </div>
                            </aside>

                            {/* Main Workspace - Sesuai Gambar  */}
                            <main className="md:col-span-9 space-y-6">
                                <div className="grid md:grid-cols-3 gap-6">
                                    <div className="md:col-span-2 bento-card p-6 space-y-6">
                                        <div>
                                            <label className="text-[10px] text-neutral-500 uppercase font-bold mb-3 block tracking-widest">Cover Image</label>
                                            <div onClick={() => document.getElementById('cIn').click()} className="border-2 border-dashed border-[#84cc16]/30 h-48 flex flex-col items-center justify-center cursor-pointer hover:border-[#84cc16] transition-all">
                                                <input id="cIn" type="file" className="hidden" onChange={e => setEmbedCover(e.target.files[0])} accept="image/*" />
                                                {embedCover ? (
                                                    <div className="text-center">
                                                        <ImageIcon className="w-8 h-8 text-[#84cc16] mx-auto mb-2" />
                                                        <p className="text-xs text-[#84cc16] font-bold">{embedCover.name}</p>
                                                        <p className="text-[10px] text-neutral-500">{(embedCover.size / 1024).toFixed(1)} KB</p>
                                                    </div>
                                                ) : (
                                                    <ImageIcon className="w-10 h-10 text-neutral-800" />
                                                )}
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-2 p-1 bg-black border border-neutral-900">
                                            <button className="py-2 text-[10px] font-bold bg-neutral-800 text-[#84cc16]">TEXT MESSAGE</button>
                                            <button className="py-2 text-[10px] font-bold text-neutral-600">BINARY FILE</button>
                                        </div>

                                        <div>
                                            <label className="text-[10px] text-neutral-500 uppercase font-bold mb-3 block tracking-widest">Enter Secret Message</label>
                                            <textarea value={secretText} onChange={e => setSecretText(e.target.value)} placeholder="Tulis pesan rahasia..." className="w-full h-32 bg-black border border-neutral-900 p-4 text-xs outline-none focus:border-[#84cc16] text-white font-mono" />
                                        </div>
                                    </div>

                                    <div className="space-y-6">
                                        <div className="bento-card p-6 space-y-4">
                                            <div className="flex items-center gap-2 mb-2">
                                                <Terminal className="w-4 h-4 text-[#84cc16]" />
                                                <h3 className="text-[10px] font-bold uppercase tracking-widest">Protocol Summary</h3>
                                            </div>
                                            <div className="space-y-3 font-mono text-[9px]">
                                                <div className="flex justify-between border-b border-neutral-900 pb-1">
                                                    <span className="text-neutral-500">MODE:</span>
                                                    <span className="text-white">EOF_APPEND</span>
                                                </div>
                                                <div className="flex justify-between border-b border-neutral-900 pb-1">
                                                    <span className="text-neutral-500">SIGNATURE:</span>
                                                    <span className="text-white">EOFSTEG1</span>
                                                </div>
                                                <div className="flex justify-between border-b border-neutral-900 pb-1">
                                                    <span className="text-neutral-500">INTEGRITY:</span>
                                                    <span className="text-[#84cc16]">READY</span>
                                                </div>
                                            </div>
                                        </div>

                                        <button onClick={handleEmbed} className="w-full py-6 bg-[#84cc16] text-black font-black text-sm uppercase tracking-widest hover:bg-[#a3e635] shadow-[0_5px_15px_rgba(132,204,22,0.3)] flex items-center justify-center gap-2">
                                            <Zap className="w-5 h-5 fill-current" /> EXECUTE EMBED PROCESS
                                        </button>
                                    </div>
                                </div>
                            </main>
                        </div>

                        <footer className="text-center py-10 text-[9px] text-neutral-700 font-mono tracking-[0.5em] uppercase select-none">
                            © 2026 NYETAK PROTOCOL // SECURED BY BENTO CLIENT ENGINE
                        </footer>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
