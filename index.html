<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYETAK - Steganography Tool</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* Sesuai PRD 2.1: Cyber Dark Theme */
        body { 
            font-family: 'JetBrains Mono', monospace; 
            background-color: #000000; 
            color: #d4d4d4; 
        }
        /* Bento Card System - PRD 2.2 */
        .bento-card { 
            background-color: #0a0a0a; 
            border: 1px solid #1a1a1a; 
            transition: all 0.3s ease;
        }
        .lime-accent { color: #84cc16; } /* PRD 19 */
        .lime-glow { text-shadow: 0 0 10px rgba(132, 204, 22, 0.4); } /* PRD 28 */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #84cc16; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Marker Teknis - PRD 115
        const MARKER = "EOFSTEG1";

        function App() {
            const [tab, setTab] = React.useState('embed');
            const [cover, setCover] = React.useState(null);
            const [secret, setSecret] = React.useState('');
            const [result, setResult] = React.useState(null);
            const [extractSource, setExtractSource] = React.useState(null);
            const [extractedData, setExtractedData] = React.useState(null);
            const [error, setError] = React.useState(null);

            // PRD 3.1: Logika Penyisipan Data (EOF Append)
            const handleEmbed = async () => {
                setError(null);
                try {
                    if (!cover) throw new Error("Missing cover image."); 
                    if (!secret.trim()) throw new Error("Secret message is empty.");

                    const cBuf = new Uint8Array(await cover.arrayBuffer());
                    const sBuf = new TextEncoder().encode(secret);
                    const meta = JSON.stringify({ imageSize: cBuf.length, name: "secret.txt" });
                    const mBuf = new TextEncoder().encode(meta);
                    const mark = new TextEncoder().encode(MARKER);

                    const final = new Uint8Array(cBuf.length + sBuf.length + mBuf.length + mark.length);
                    final.set(cBuf, 0);
                    final.set(sBuf, cBuf.length);
                    final.set(mBuf, cBuf.length + sBuf.length);
                    final.set(mark, cBuf.length + sBuf.length + mBuf.length);

                    setResult({
                        url: URL.createObjectURL(new Blob([final], { type: cover.type })),
                        name: "NYETAK_" + cover.name
                    });
                } catch (e) { setError(e.message); }
            };

            // PRD 3.2: Logika Ekstraksi Data
            const handleExtract = async () => {
                setError(null);
                try {
                    if (!extractSource) throw new Error("No source file selected.");
                    const buf = new Uint8Array(await extractSource.arrayBuffer());
                    const dec = new TextDecoder();
                    
                    if (dec.decode(buf.slice(-MARKER.length)) !== MARKER) throw new Error("Invalid marker.");

                    const metaPart = dec.decode(buf.slice(-150));
                    const startIdx = metaPart.lastIndexOf('{');
                    const endIdx = metaPart.lastIndexOf('}') + 1;
                    const meta = JSON.parse(metaPart.substring(startIdx, endIdx));

                    const secretBuf = buf.slice(meta.imageSize, buf.length - MARKER.length - (endIdx - startIdx));
                    setExtractedData(dec.decode(secretBuf));
                } catch (e) { setError("Extraction failed: " + e.message); }
            };

            return (
                <div className="min-h-screen p-4 md:p-10 selection:bg-[#84cc16] selection:text-black">
                    <div className="max-w-6xl mx-auto space-y-6">
                        
                        {/* Header Banner - PRD 2.2.A */}
                        <header className="p-8 bento-card border-l-4 border-[#84cc16] flex justify-between items-center shadow-lg shadow-[#84cc16]/5">
                            <div>
                                <h1 className="text-3xl font-bold tracking-tighter lime-accent lime-glow">NYETAK // <span className="text-neutral-600 font-normal">steganography</span></h1>
                                <p className="text-[10px] text-neutral-500 tracking-[0.4em] uppercase mt-2">Secure Data Embedding Protocol V1.0</p>
                            </div>
                            <div className="hidden md:block opacity-20 text-4xl font-black italic">BENTO_CORE</div>
                        </header>

                        <div className="grid grid-cols-1 md:grid-cols-12 gap-6">
                            {/* Sidebar Nav - PRD 2.2.B */}
                            <aside className="md:col-span-3 space-y-4">
                                <nav className="space-y-2">
                                    <button onClick={() => setTab('embed')} className={`w-full p-6 text-left border-2 transition-all ${tab === 'embed' ? 'border-[#84cc16] bg-[#84cc16]/5 text-white' : 'border-neutral-900 text-neutral-600 hover:border-neutral-700'}`}>
                                        <p className="text-xs font-bold uppercase tracking-widest">01. Embed</p>
                                        <p className="text-[9px] opacity-40 uppercase">Hide Secret Data</p>
                                    </button>
                                    <button onClick={() => setTab('extract')} className={`w-full p-6 text-left border-2 transition-all ${tab === 'extract' ? 'border-[#84cc16] bg-[#84cc16]/5 text-white' : 'border-neutral-900 text-neutral-600 hover:border-neutral-700'}`}>
                                        <p className="text-xs font-bold uppercase tracking-widest">02. Extract</p>
                                        <p className="text-[9px] opacity-40 uppercase">Reveal Hidden Data</p>
                                    </button>
                                </nav>
                                <div className="p-4 bento-card text-[9px] font-mono text-neutral-600 space-y-1">
                                    <p className="lime-accent">&gt; SYSTEM: ONLINE</p>
                                    <p>&gt; METHOD: EOF_APPEND</p>
                                    <p className="animate-pulse">&gt; WAITING_IO_DEVICE...</p>
                                </div>
                            </aside>

                            {/* Main Area - PRD 2.2.C */}
                            <main className="md:col-span-9 bento-card p-10 min-h-[500px]">
                                {error && <div className="mb-6 p-4 bg-red-950/20 border-l-2 border-red-500 text-red-400 text-[10px] font-mono tracking-tighter"> &gt; ERROR: {error}</div>}
                                
                                {tab === 'embed' ? (
                                    <div className="space-y-8 animate-in fade-in duration-500">
                                        <div className="grid md:grid-cols-2 gap-8">
                                            <div className="space-y-6">
                                                <label className="text-[10px] text-neutral-500 uppercase font-bold tracking-widest">Cover Image Selection</label>
                                                <div className="border-2 border-dashed border-neutral-900 h-48 flex items-center justify-center cursor-pointer hover:border-[#84cc16] transition-all relative overflow-hidden group">
                                                    <input type="file" className="absolute inset-0 opacity-0 cursor-pointer" onChange={e => setCover(e.target.files[0])} accept="image/*" />
                                                    {cover ? <span className="text-[#84cc16] text-xs font-bold uppercase">{cover.name}</span> : <span className="text-neutral-800 text-xs font-bold group-hover:text-neutral-500">UPLOAD_IMG_FILE</span>}
                                                </div>
                                                <textarea value={secret} onChange={e => setSecret(e.target.value)} placeholder="ENTER SECRET PROTOCOL MESSAGE..." className="w-full h-32 bg-black border border-neutral-900 p-4 text-xs outline-none focus:border-[#84cc16] text-[#84cc16] font-mono" />
                                            </div>
                                            <div className="flex flex-col justify-end">
                                                <button onClick={handleEmbed} className="w-full py-6 bg-[#84cc16] text-black font-black text-xs uppercase tracking-[0.3em] hover:bg-[#a3e635] shadow-lg shadow-[#84cc16]/10 active:scale-95 transition-all">
                                                    EXECUTE_EMBED
                                                </button>
                                            </div>
                                        </div>
                                        {result && (
                                            <div className="p-8 border-2 border-[#84cc16]/30 bg-[#84cc16]/5 flex justify-between items-center animate-bounce-short">
                                                <div>
                                                    <p className="text-xs font-bold text-white uppercase tracking-widest">Protocol Success</p>
                                                    <p className="text-[9px] text-neutral-500 font-mono mt-1">DATA_APPENDED_AT_EOF</p>
                                                </div>
                                                <a href={result.url} download={result.name} className="px-10 py-3 bg-white text-black font-black text-xs hover:bg-[#84cc16] transition-all tracking-widest uppercase">Download</a>
                                            </div>
                                        )}
                                    </div>
                                ) : (
                                    <div className="space-y-8 animate-in fade-in duration-500">
                                        <div className="border-2 border-dashed border-neutral-900 h-64 flex items-center justify-center cursor-pointer hover:border-[#84cc16] transition-all relative group">
                                            <input type="file" className="absolute inset-0 opacity-0 cursor-pointer" onChange={e => setExtractSource(e.target.files[0])} />
                                            {extractSource ? <span className="text-[#84cc16] text-xs font-bold uppercase">{extractSource.name}</span> : <span className="text-neutral-800 text-xs font-bold group-hover:text-neutral-500">SCAN_STEGO_IMAGE</span>}
                                        </div>
                                        <button onClick={handleExtract} className="w-full py-6 bg-white text-black font-black text-xs uppercase tracking-[0.3em] hover:bg-[#84cc16] active:scale-95 transition-all">
                                            DECRYPT_AND_EXTRACT
                                        </button>
                                        {extractedData && (
                                            <div className="p-6 bg-black border border-neutral-900 space-y-4 animate-in slide-in-from-bottom">
                                                <p className="text-[10px] text-[#84cc16] font-black tracking-widest uppercase">&gt; SECRET_REVEALED:</p>
                                                <p className="text-xs text-neutral-400 font-mono leading-relaxed bg-neutral-900/30 p-4 border border-neutral-800">{extractedData}</p>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </main>
                        </div>
                        <footer className="text-center py-12 text-[10px] text-neutral-800 font-mono tracking-[0.6em] uppercase select-none italic">
                            &copy; 2026 NYETAK PROTOCOL // CLIENT_SIDE_ONLY_ENGINE
                        </footer>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
