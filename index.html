<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYETAK - Steganography Tool</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Sesuai Spesifikasi PRD 2.1 [cite: 16, 17, 21] */
        body { font-family: 'JetBrains Mono', monospace; background-color: #000000; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #84cc16; }
    </style>
</head>
<body class="text-neutral-300">
    <div id="root"></div>

    <script type="text/babel">
        const { Zap, Unlock, Image: ImageIcon, Upload, Cpu, AlertTriangle } = lucide;
        const STEG_MARKER = "EOFSTEG1"; // [cite: 115]

        const App = () => {
            const [activeTab, setActiveTab] = React.useState('embed');
            const [embedCover, setEmbedCover] = React.useState(null);
            const coverInputRef = React.useRef(null);

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <div className="max-w-5xl mx-auto space-y-6">
                        {/* Header Bento [cite: 24, 27, 29] */}
                        <header className="p-6 bg-neutral-900/50 border-l-4 border-[#84cc16] flex justify-between items-center">
                            <div>
                                <h1 className="text-3xl font-bold tracking-tighter text-[#84cc16]">NYETAK</h1>
                                <p className="text-[10px] text-neutral-500 tracking-[0.2em]">SECURE DATA EMBEDDING PROTOCOL</p>
                            </div>
                            <Cpu className="text-neutral-700 w-10 h-10" />
                        </header>

                        <div className="grid md:grid-cols-12 gap-6">
                            {/* Sidebar Nav [cite: 32, 35] */}
                            <nav className="md:col-span-3 flex flex-col gap-2">
                                <button onClick={() => setActiveTab('embed')} 
                                    className={`p-4 border ${activeTab === 'embed' ? 'border-[#84cc16] bg-[#84cc16]/5' : 'border-neutral-800'}`}>
                                    EMBED
                                </button>
                                <button onClick={() => setActiveTab('extract')} 
                                    className={`p-4 border ${activeTab === 'extract' ? 'border-[#84cc16] bg-[#84cc16]/5' : 'border-neutral-800'}`}>
                                    EXTRACT
                                </button>
                            </nav>

                            {/* Workspace [cite: 43, 48] */}
                            <main className="md:col-span-9 bg-neutral-900/40 border border-neutral-800 p-8 min-h-[400px]">
                                <div className="space-y-6">
                                    <label className="text-[10px] text-neutral-500 uppercase font-bold">Cover Image [cite: 51]</label>
                                    <div onClick={() => coverInputRef.current.click()} 
                                        className="border-2 border-dashed border-neutral-700 h-48 flex flex-col items-center justify-center cursor-pointer hover:border-[#84cc16] transition-colors">
                                        <input type="file" className="hidden" ref={coverInputRef} onChange={e => setEmbedCover(e.target.files[0])} />
                                        {embedCover ? (
                                            <span className="text-[#84cc16] font-bold">{embedCover.name}</span>
                                        ) : (
                                            <Upload className="text-neutral-700 w-12 h-12" />
                                        )}
                                    </div>
                                    <button className="w-full py-4 bg-[#84cc16] text-black font-bold uppercase tracking-widest">
                                        Execute Process [cite: 60]
                                    </button>
                                </div>
                            </main>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
